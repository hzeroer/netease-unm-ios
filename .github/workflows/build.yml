name: build

on:
  push:
    branches: [main, master]
    tags: ["V*"]
  workflow_dispatch:

jobs:
  test:
    name: Unit tests (host)
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: |
          set -e
          chmod +x tools/*.sh
          ./tools/run-tests.sh

  dylib:
    name: Build UNMiOS.dylib (TrollStore / TrollFools)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the iPhoneOS SDK
        run: |
          set -e
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/theos/sdks.git "$HOME/sdks"
          cd "$HOME/sdks"
          git sparse-checkout set iPhoneOS16.5.sdk
          du -sh iPhoneOS16.5.sdk

      - name: Install dpkg
        run: |
          # pack.sh skips the .deb silently when dpkg-deb is absent, which is how the
          # deb artifact quietly disappeared from CI while the dylib kept uploading.
          brew install dpkg

      - name: Build
        run: |
          set -e
          export IOS_SDK="$HOME/sdks/iPhoneOS16.5.sdk"
          # arm64 only: an injected dylib is loaded by a userland app, which is arm64.
          # arm64e exists for system daemons, and a universal slice here only adds a way for
          # TrollFools to report "no code signature found" on a binary that is otherwise fine.
          export ARCHS="arm64"
          chmod +x tools/*.sh
          ./tools/build-dylib.sh
          ./tools/pack.sh

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: UNMiOS-dylib
          path: |
            dist/UNMiOS.dylib
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: UNMiOS-deb
          path: dist/UNMiOS.deb
          if-no-files-found: error

  # Tagging is the release trigger: the artefacts attached to a GitHub Release are the ones
  # CI just built, so a release can never carry a binary that was compiled on someone's laptop.
  release:
    name: Publish release
    needs: [test, dylib]
    if: startsWith(github.ref, 'refs/tags/V')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artefacts
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"
          ls -l assets
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG exists; replacing its assets"
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "UNMiOS $TAG" \
              --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$TAG" assets/* --repo "$GITHUB_REPOSITORY" --clobber
